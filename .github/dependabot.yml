version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: 'chore'
          include: scope
      groups:
          minor-and-patch:
              update-types: [minor, patch]
      ignore:
          # eslint-plugin-react / jsx-a11y don't support ESLint 10 yet
          - dependency-name: eslint
            update-types: [version-update:semver-major]
          - dependency-name: '@eslint/js'
            update-types: [version-update:semver-major]
          # typescript-eslint doesn't support TypeScript 7 yet
          - dependency-name: typescript
            update-types: [version-update:semver-major]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: 'ci'
      groups:
          actions:
              patterns: ['*']
